# Windows installer: KadaiSetup-<version>-x64.exe, the one-click offline on-prem installer.
#   1. native win-x64 server bundle (built and smoke-tested on Windows: native modules)
#   2. offline dependencies (Node.js 22, PostgreSQL 16, WinSW), verified, + the Windows kit
#   3. Inno Setup compile (code-signed when KADAI_SIGN_PFX_BASE64 / KADAI_SIGN_PFX_PASS are set)
#   4. end to end on the runner: silent install -> upgrade -> uninstall -> reinstall
# Runs on changes to the Windows kit, on demand (Actions -> Windows installer -> Run workflow)
# and from release.yml for every version tag (asset of the GitHub release).
name: Windows installer

on:
  push:
    paths:
      - deploy/onprem/windows/**
      - deploy/tests/windows/**
      - .github/workflows/windows-installer.yml
      - .github/scripts/bundle.sh
  workflow_dispatch:
    inputs:
      version:
        description: Version stamped on the installer (default <package.json version>-ci.<run number>)
        required: false
        default: ''
      e2e:
        description: Run the install / upgrade / uninstall / reinstall test
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      artifact-name:
        type: string
        default: release-windows-installer
      e2e:
        type: boolean
        default: true
    secrets:
      KADAI_SIGN_PFX_BASE64:
        required: false
      KADAI_SIGN_PFX_PASS:
        required: false

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}-${{ inputs.version || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  installer:
    name: KadaiSetup.exe (build · install · upgrade · uninstall · reinstall)
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      version: ${{ steps.v.outputs.version }}
      artifact: ${{ inputs.artifact-name || format('KadaiSetup-{0}-x64', steps.v.outputs.version) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version=$INPUT_VERSION
          if [ -z "$version" ]; then
            version="$(node -p "require('./package.json').version")-ci.${RUN_NUMBER}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid version '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Installer version: $version"

      - name: Windows PowerShell 5.1 can parse the kit and installer scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem deploy/onprem/windows, deploy/tests/windows -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - run: pnpm install --frozen-lockfile
      - name: Build server and web app
        env:
          KADAI_VENDOR_LICENSE_KID: ${{ vars.KADAI_VENDOR_LICENSE_KID }}
          KADAI_VENDOR_LICENSE_PUBLIC_KEY: ${{ vars.KADAI_VENDOR_LICENSE_PUBLIC_KEY }}
        run: |
          pnpm --filter @kadai/server build
          pnpm --filter @kadai/web build
          node apps/server/dist/cli.js issue-license keys || echo "::warning::This installer accepts no customer license (Free plan only): set the repository variables KADAI_VENDOR_LICENSE_KID and KADAI_VENDOR_LICENSE_PUBLIC_KEY"
      - name: Assemble and smoke-test the win-x64 bundle
        run: .github/scripts/bundle.sh "${{ steps.v.outputs.version }}" win-x64 dist/release

      - name: Inno Setup 6
        shell: powershell
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { exit 1 } }
          if (-not (Test-Path $iscc)) { Write-Host "::error::ISCC.exe not found"; exit 1 }
          # (ISCC /? exits with 1, so only report the version of the file.)
          Write-Host "ISCC $((Get-Item $iscc).VersionInfo.ProductVersion) at $iscc"
          exit 0

      - name: Build KadaiSetup-${{ steps.v.outputs.version }}-x64.exe
        shell: powershell
        env:
          VERSION: ${{ steps.v.outputs.version }}
          KADAI_SIGN_PFX_BASE64: ${{ secrets.KADAI_SIGN_PFX_BASE64 }}
          KADAI_SIGN_PFX_PASS: ${{ secrets.KADAI_SIGN_PFX_PASS }}
        run: |
          & deploy\onprem\windows\installer\build-installer.ps1 -Version $env:VERSION `
            -Bundle "dist\release\kadai-server-$env:VERSION-win-x64.zip" -OutDir dist\installer
          if (-not $?) { exit 1 }

      - name: End to end (silent install, upgrade, uninstall, reinstall)
        # Always on push; on demand and from release.yml per the e2e input (default on). A called
        # workflow sees the caller's event name, so the input decides, not github.event_name.
        if: inputs.e2e != false
        shell: powershell
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          & deploy\tests\windows\installer-e2e.ps1 -Setup "dist\installer\KadaiSetup-$env:VERSION-x64.exe" -LogDir dist\installer-e2e
          if (-not $?) { exit 1 }

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name || format('KadaiSetup-{0}-x64', steps.v.outputs.version) }}
          path: dist/installer/KadaiSetup-*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload installer test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-e2e-logs-${{ github.run_attempt }}${{ inputs.artifact-name && '-release' || '' }}
          path: dist/installer-e2e
          if-no-files-found: ignore
          retention-days: 14

  # Visual review: clicks through the real wizard on a fresh Windows machine (language dialog,
  # every page in English with the "port in use" message, then a full install in Tamil with the
  # progress and finish pages) and uploads a PNG of each page. Not part of release builds.
  wizard-tour:
    name: Wizard screenshots (English · தமிழ்)
    needs: installer
    if: ${{ !inputs.artifact-name }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.installer.outputs.artifact }}
          path: dist/installer
      - name: English pages (stops at "Ready"; shows the port-in-use message)
        shell: powershell
        env:
          VERSION: ${{ needs.installer.outputs.version }}
        run: |
          & deploy\tests\windows\wizard-tour.ps1 -Setup "dist\installer\KadaiSetup-$env:VERSION-x64.exe" -Lang ask -Prefix english -BusyPort 8080
          if (-not $?) { exit 1 }
      - name: Tamil pages with a full installation (progress and finish pages)
        shell: powershell
        env:
          VERSION: ${{ needs.installer.outputs.version }}
        run: |
          & deploy\tests\windows\wizard-tour.ps1 -Setup "dist\installer\KadaiSetup-$env:VERSION-x64.exe" -Lang tamil -Install
          if (-not $?) { exit 1 }
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wizard-screenshots
          path: dist/wizard-tour
          if-no-files-found: warn
          retention-days: 30
